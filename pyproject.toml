[project]
name = "multi-agent-esp32"
version = "2.0.0"
description = "Multi-Agent ESP32 Orchestration System with AI-driven frequency control, firmware OTA, and cloud integration."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
ai = [
    "groq>=0.11.0",
]
cloud = [
    "boto3>=1.34.0",
    "google-cloud-pubsub>=2.0.0",
]
db = [
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
all = [
    "multi-agent-esp32[ai,cloud,db,dev]",
]

[project.scripts]
multi-agent = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["orchestrator", "agents", "api", "ai", "comms", "cloud", "firmware", "logging_system"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

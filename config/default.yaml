# Multi-Agent ESP32 Orchestration System

# Core settings
health_check_interval: 10       # seconds between device health-checks

# Frequency agent defaults
frequency_agent:
  default_band: "2.4GHz"
  hop_sequence:
    - 2412000000
    - 2437000000
    - 2462000000

# Modulation agent defaults
modulation_agent:
  default_scheme: "GFSK"

# Firmware agent
firmware_agent:
  build_dir: "/tmp/esp32_builds"

# Communications agent
comms_agent:
  # Telemetry webhook backend: http | vps | local | aws | gcp | azure
  #   http/vps/local — generic HTTP POST webhook (point it at your own VPS
  #                    or local server for a fully self-hosted backend)
  #   aws            — AWS IoT Core (requires boto3)
  #   gcp            — GCP Pub/Sub (requires google-cloud-pubsub)
  #   azure          — Azure IoT Hub (requires azure-iot-device)
  cloud_connector: "http"
  cloud_endpoint: ""              # Webhook URL, AWS IoT endpoint, or "projects/{p}/topics/{t}"
  # api_key: ""                   # Optional — sent as "Authorization: ******" for http/vps/local
  # path_prefix: ""               # Optional path appended to the webhook endpoint
  # aws_region: "us-east-1"       # AWS connector options
  # aws_topic: "esp32/telemetry"
  # azure_connection_string: ""   # Azure connector options

# Compute offload backend (heavy jobs: firmware builds, AI batch work, ...)
compute:
  backend: "local"                # local | vps | aws | gcp
  endpoint: ""                    # local/vps: your own worker URL; gcp: Cloud Function / Cloud Run URL
  function: ""                    # aws: Lambda function name
  # aws_region: "us-east-1"
  # api_key: ""                   # Optional bearer token for http-style compute endpoints

# AI agent
ai_agent:
  ai_research_endpoint: ""       # Optional LLM/cloud AI endpoint

# API server
server:
  host: "0.0.0.0"
  port: 8000

# Logging
logging:
  level: "INFO"
  log_dir: "logs"
  json_format: false
